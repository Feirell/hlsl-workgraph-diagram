ngth="729.169">global resource (StructuredBuffer/ConstantBuffer/... via register())</text><line x1="34" y1="1750.64" x2="876.553" y2="1750.64" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1776.249" x2="876.553" y2="1776.249" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1801.859" x2="876.553" y2="1801.859" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1827.468" x2="876.553" y2="1827.468" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1853.078" x2="876.553" y2="1853.078" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1878.687" x2="876.553" y2="1878.687" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1904.296" x2="876.553" y2="1904.296" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1929.906" x2="876.553" y2="1929.906" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="34" y1="1750.64" x2="34" y2="1929.906" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="119.411" y1="1750.64" x2="119.411" y2="1929.906" style="stroke:#1A1A1A;stroke-width:2;"/><line x1="876.553" y1="1750.64" x2="876.553" y2="1929.906" style="stroke:#1A1A1A;stroke-width:2;"/><text x="34" y="1954.327" fill="#1A1A1A" font-size="22" textLength="599.629">Red border = graph entry point (NodeIsProgramEntry)</text><text x="34" y="1979.936" fill="#1A1A1A" font-size="22" textLength="758.506">Dashed border = grid can expand to >1 thread group per invocation</text><text x="34" y="2005.545" fill="#1A1A1A" font-size="22" textLength="874.436">(NodeMaxDispatchGrid, or NodeDispatchGrid != (1,1,1)); solid border = always</text><text x="34" y="2031.155" fill="#1A1A1A" font-size="22" textLength="823.55">exactly one group (NodeDispatchGrid(1,1,1), thread launch, or coalescing)</text><text x="34" y="2056.764" fill="#1A1A1A" font-size="22" textLength="899.239">A dashed edge from a global resource box into a node means that node reads it -</text><text x="34" y="2082.373" fill="#1A1A1A" font-size="22" textLength="835.753">a global is effectively an input too, just dashed to stay visually distinct from</text><text x="34" y="2107.983" fill="#1A1A1A" font-size="22" textLength="914.235">a produced-record edge; each global is replicated once per consuming node-group</text><text x="34" y="2133.592" fill="#1A1A1A" font-size="22" textLength="934.302">to keep edges short (see the global resource table above for the full, ungrouped list)</text><text x="34" y="2151.776" fill="#8A8A8A" font-size="14" textLength="1282.319">hlsl-workgraph-diagram v2.0.0 · parse-dxil · C:\Users\User\projects\hlsl-workgraph-diagram\examples\mesh-culling\WorkGraph.hlsl · dxc: dxcompiler.dll: 1.9 - 1.8.2404.55 (cfc8ba0c1)</text></g><?plantuml-src pLVlRk964F_EKqnpNq020YIv2nndYK2udfISJicT-WMfMjOBtc9shTrr4jhh0_Gz-WxztaVfatHcRS0uS4dQBsT7AFRE_6PdvpT_R3cB1NGgaGm5Y6NYLX0AourCdDIgOXTI9Som9Op4ZAMn6slbXZhM1bwr1tGNH0R6wFjyySnVvSM2zec_2W8VjHCNZ2_cHgSgpAN65tINfRG9XSabklxQA_4vadoXXBNGBgtJFcxbhmAwUnOEkVS9DyVckzOVkPaBVGldIio52hyDayayZR9nf5rqqGZkc9fZO7-h05utsOaQ9GoqE_xLFlF-_Mu4-lsfqIpap3gfva40huRZo_FnUByirqWcotF9yNXySj7QB-aY8rX8KgFkk3FgxfTQ2Xjvf3EqEjWlawg5qlUAn2xzjLzCF3XX58izN8VkyZ6WZ79cvNridNGx5mM13PEsGYU5vLktYiMEZP3PI8IFHPQOGdAx_diXQ25pRChiEcQFK-7iyc9q_ZXutU6RmSaGeIf9nZquKXfpkC7rCacTECe1jwGuma2XQWz9TTPvypeOfd7y4LNwn_vzC54JrPT1toAnUkrMC1A9YthGxX_Jcw1_B8DTWVT6XZsehc7F1tG7xJLU_SKBjOEcFdlYMBGs_79rzVFd7syk1wDRgBu-hTNXe1rudg5TKpU2upc3LBs3ku4jyENfwM0KzFiZQHFcU9Hf1y7Qqa6Ct8nEtOliN6DkV50OuB8XVnPbjpnG5stXsO6B1EZfByW7cAQp6HQ5gjB0k4jP31p9W0aCiPvB3f4m0Xge8ItW7yjnjuYXP7DYhrs8M3YjQi1KY8r4EWjQ2Q0KRiGiLJmY1fAd2HhCyX-8u0dCCFdAk3TOt8GX9ucPu3HmhMow5CrSz0YOXJLpeLoddc3y9INnCoZV-hue_t9-_o_clvIIXwWFrVOXGhutB8d0rrH8j5Ik1n4I29a6LlhGXJdecZt8X7NKTwYm2UaZBi2cQEyfaiJFfolaBXkV84td2TByyyUVcAB_AMOGhXHRIluChjnSVznMnvFETr8T3rQj0_ouBfGF2bWF38PL65orWAK3sV3w59oHFcxsKMtPeKYffcpcYqrR9dviIagZ4PGqAWedHAngW0LoWOmXNr_WeCnASmKnWP0gMygIhRNXvrWvt6IapxQjZKhivqGmSXuvHFiAaCqDzDzLTh1BsW9ypLRx-OGN-ATY9XL4ij4k4zaEVGM1RAhB1F9u5BJzE9SjKWYAItuqovRMunGSGwgCi3g-4-Y8m8Ob51SxW3GQPLhpM4zHX-HJWrBLMsTIR6r6X1U-sHqFiP5Wd