 coalescing)</text><text x="34" y="2096.764" fill="#1A1A1A" font-size="22" textLength="899.239">A dashed edge from a global resource box into a node means that node reads it -</text><text x="34" y="2122.373" fill="#1A1A1A" font-size="22" textLength="835.753">a global is effectively an input too, just dashed to stay visually distinct from</text><text x="34" y="2147.983" fill="#1A1A1A" font-size="22" textLength="914.235">a produced-record edge; each global is replicated once per consuming node-group</text><text x="34" y="2173.592" fill="#1A1A1A" font-size="22" textLength="934.302">to keep edges short (see the global resource table above for the full, ungrouped list)</text><text x="34" y="2191.776" fill="#8A8A8A" font-size="14" textLength="310.399">hlsl-workgraph-diagram v2.0.5 · dxil parsing</text><text x="34" y="2211.776" fill="#8A8A8A" font-size="14" textLength="350.834">dxc: dxcompiler.dll: 1.9 - 1.8.2404.55 (cfc8ba0c1)</text></g><?plantuml-src pLVDSk964Bxp51tl1Qe00pQsOLbLOJ2RhRATBNjpswhK80re5Z6ZcXbXasmU8E-HTyWzZv8dIVT80Y73saukA_bWPhxkdfx--aV6Pn67JYKK0GU-ZEqQ0cvyBM8hbAoOXP0nqsm9OpvZIMGdIjgHYfI6D-qXlGN8K6lra6rstLFUB4YVkAS0k5MMNp9_CTSgaK66cbpIMqOf7N2T8NhksOlu50f_8Ranq2xjqpdknQySUdis3hdt4G_7vhlMdxYPWRwbvvhFkGo-hIR5FAzbuqYxwABclcLoZe7zhGButAKtgYNNqEwufNtctVfk10Q3gLOiy9cnGiuz3zwC9bSNayb-hA-GJCRFa9F9vEIojHzfGyrPGAXnRz8Pz_QZbjo4JbCNhGxtOnAvaEf14kpAFVjX_D5oBLdar7NeBLy3OgJLQ-TZwwJNkIm0DapQWauAs_Ts7V4T6m4p8G-UGfQOGcAx_tiXQ06pRCfC7hEdgT2zkXnVF0rURtG-F1cXgagSSW-EfC8SRlXg6IUM7sKAjwGuma2XQ1z9rUsSdtcZ98fkKMHmxDQzp_Ap70XlO91O_NRB6_FOXdre3uvfnHiS2syNy5wBe0_LNEt5a5wldUkhltgZTj3K9qSSWzP6FrzV__BfnxkhuVWUgcUdjJeSj0ClCxHhwexxUCyWPF_WQM2h-EhqT3Zs1eEnC36pVfXAUrvkwQ2Ep8nAxAlit61kV90OuB8XTnTbjvoY7jh2kmCRSb3JByW7c2Qp6HQ5gbJ0V9km27ma0oOmH6ekV0Yvvj102M40_rYcTwin46nEx3KB7d6hP0sO3B2H26j0IGwKmes89T8FYO7aQOm6q_m78dWCCqo-ijuxB6vSavF4JB0AV2LDikJD37e4p43EN2ZNgMSOVqL9_0BAjxuloh-Ut_-B-Q-bv27gGxLzY93lDOj3S3KLOYMaxKE814AcWH4kT46cD6SFCY6F-WuLDY5zmWNO5EqzHPBu-No5t6NZCwJfF4EQV_xu4rFqFyKCWhLaI-6_W2jtDxVRwdZI