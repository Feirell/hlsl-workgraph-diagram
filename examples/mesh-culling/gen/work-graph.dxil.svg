h, or coalescing)</text><text x="34" y="2096.764" fill="#1A1A1A" font-size="22" textLength="899.239">A dashed edge from a global resource box into a node means that node reads it -</text><text x="34" y="2122.373" fill="#1A1A1A" font-size="22" textLength="835.753">a global is effectively an input too, just dashed to stay visually distinct from</text><text x="34" y="2147.983" fill="#1A1A1A" font-size="22" textLength="914.235">a produced-record edge; each global is replicated once per consuming node-group</text><text x="34" y="2173.592" fill="#1A1A1A" font-size="22" textLength="934.302">to keep edges short (see the global resource table above for the full, ungrouped list)</text><text x="34" y="2191.776" fill="#8A8A8A" font-size="14" textLength="310.399">hlsl-workgraph-diagram v2.0.0 · dxil parsing</text><text x="34" y="2211.776" fill="#8A8A8A" font-size="14" textLength="350.834">dxc: dxcompiler.dll: 1.9 - 1.8.2404.55 (cfc8ba0c1)</text></g><?plantuml-src pLVDSjis4BxhARREHPgHP4d-YQKed94jAysCdMRiz9QP3WH28Y8Au02WRRNf0_Gz-Wwzzr7w9Dq5IOcYfTXkBo5zi81lTx7ORtzeEOi5z6gH30M8PU9M40hBZKoSrAfc5r8bpB0bZCMCfR6RQEKkTAmDlEgEw2r1HiRe-tppn3_LpPBqaNzAW0_QYNF65tEZKnNcgCavlLMKDg4mEQBldvs8Jv7a2oMiXMvbdyvnAtyLqD-niS-zZtWuDj-s_iZD7FGjFLTYBbJuRJKPvcajQqUwPHUDu8wfEGRsjnhWSvFTg572GBVdbtQPz-lR4HWEfqQpa3Fhf9e70Rowc5oUJIQxiLmZcIpFaPF9vEYyinlf8YDOIAXnVz8RztUZbi96NjC9MXtjngHgeVIz8jYbVtR3n8CJHh7Og-lHMxq6n2XdLjx7pb6_Tru2h9cq0HsLjc_TAXPRDa9c8n4-XYmnXUHc__TIq4Bcs9JP8cQFK-7aydnyzZXu_OlNewCBL5LBCkx1WTAOmoskbqdgn46kS4EA0mmKYWwGL2UzrwV1HHh77r1aUEZNWy_ginhAO6YHM8Dk9nYBn4K3w0uFQIKO7ifW6_3Eo700zKBjsOZUe5leQxvuex7Nr2TF78lMBdw-klhbquytbwFnBTHFZnjDs6i7dcTeszIDu7ZF8DLWxsbWe_Zo-7Wq3eR3iRG9SppAf8EWiBHNHsv6f-v5TgunDzuh373LaB-BgbjUKHzjuTs1YmJewHVa0qpJsGoBGbrfODobB0QEPC04XbZF9OT8604jb90My8_bUZSQGydcn5wx4B5mMZM0gH0RYNGMj190AToAMQfuH0maJnCqcEK_4C4Jc67oLVNUO74JXfmaPeBJmBMowLAqS-W1C0i5Sw5QfvvW_2KbyJCet_c-AFzoVlylvh-Kalke3_NkFaA-Coo9mDTKIBHKRW0H4WYP1bRwq8Mvqe8zo8GYwbjKM8Vq4HTWNRHt54dYvzCLSfkDJv2czmHf_ldZJqpH_nGp25UABIL_1bTkhZz